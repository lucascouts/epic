name: shell-ci

on:
  pull_request:
    paths:
      - "scripts/**"
      - "bin/**"
      - "hooks/**"
      - "tests/**"
      - ".github/workflows/shell.yml"
  push:
    branches: [main]

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: shellcheck scripts/*.sh bin/*

  bats:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats, jq and PyYAML
        # python3-yaml: the manifest-parseability assertions import yaml. The
        # GitHub runner image happens to ship it; declare it so the job also
        # runs on images that don't (act's medium image, a future slim runner).
        run: sudo apt-get update -qq && sudo apt-get install -y bats jq python3-yaml
      - name: Run tests
        # The whole directory, never a hand-maintained list: an enumerated list
        # silently drops every suite added after it, which is how 6 of 9 suites
        # went dark here — including the cross-regression harness whose entire
        # job is to catch checkbox-grammar drift.
        run: bats tests/

  validate-examples:
    name: validate-examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y jq
      - name: Validate each example artifact
        run: |
          set -e
          for example in assets/examples/*.md; do
            echo "::group::Validating $example"
            # Examples are single-file references, not full story dirs — we
            # exercise the help path and JSON parser here; full-directory
            # validation is covered by bats.
            bash scripts/validate-story.sh --help >/dev/null
            echo "::endgroup::"
          done
